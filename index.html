<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine öffentliche IP-Adresse</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#14181f; --muted:#5b6472; --card:#fff; --border:#d9dde3; --accent:#1f5eff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --fg:#eceff4; --muted:#9aa4b2; --card:#1b1f27; --border:#2c323d; --accent:#6d97ff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { margin:0 0 20px; font-size:1.25rem; }
  .row { padding:12px 0; border-top:1px solid var(--border); }
  .label { font-size:.8rem; color:var(--muted); }
  .value { font:600 1.25rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow-wrap:anywhere; }
  .value.none { font-weight:400; color:var(--muted); font-size:1rem; }
  button { margin-top:6px; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--fg); font:inherit; font-size:.85rem; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button[hidden] { display:none; }
  .error { margin-top:16px; color:#c0392b; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Deine öffentliche IP-Adresse</h1>
  <div class="row">
    <div class="label">IPv4</div>
    <div class="value" id="v4" aria-live="polite">Wird ermittelt …</div>
    <button type="button" id="c4" hidden>Kopieren</button>
  </div>
  <div class="row">
    <div class="label">IPv6</div>
    <div class="value" id="v6" aria-live="polite">Wird ermittelt …</div>
    <button type="button" id="c6" hidden>Kopieren</button>
  </div>
  <button type="button" id="reload">Neu laden</button>
  <p class="error" id="err" role="alert" hidden></p>
</main>
<script>
  const TIMEOUT_MS = 6000;
  async function getIp(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return (await res.json()).ip;
    } finally { clearTimeout(timer); }
  }
  function show(id, ip) {
    const el = document.getElementById("v" + id);
    const btn = document.getElementById("c" + id);
    if (ip) { el.textContent = ip; el.classList.remove("none"); btn.hidden = false; }
    else { el.textContent = "Nicht verfügbar"; el.classList.add("none"); btn.hidden = true; }
  }
  async function load() {
    const err = document.getElementById("err");
    err.hidden = true;
    for (const id of ["4", "6"]) {
      const el = document.getElementById("v" + id);
      el.textContent = "Wird ermittelt …"; el.classList.add("none");
      document.getElementById("c" + id).hidden = true;
    }
    // api.ipify.org liefert nur IPv4, api6.ipify.org nur IPv6
    const [r4, r6] = await Promise.allSettled([
      getIp("https://api.ipify.org?format=json"),
      getIp("https://api6.ipify.org?format=json")
    ]);
    show("4", r4.status === "fulfilled" ? r4.value : null);
    show("6", r6.status === "fulfilled" ? r6.value : null);
    if (r4.status === "rejected" && r6.status === "rejected") {
      err.textContent = "Die IP-Adresse konnte nicht abgerufen werden. Prüfe deine Verbindung oder Werbeblocker und versuche es erneut.";
      err.hidden = false;
    }
  }
  for (const id of ["4", "6"]) {
    const btn = document.getElementById("c" + id);
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(document.getElementById("v" + id).textContent);
        btn.textContent = "Kopiert"; } catch { btn.textContent = "Fehlgeschlagen"; }
      setTimeout(() => (btn.textContent = "Kopieren"), 1500);
    });
  }
  document.getElementById("reload").addEventListener("click", load);
  load();
</script>
</body>
</html>
