<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT-Tools: IP-Adresse und DNS-Abfrage</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#14181f; --muted:#5b6472; --card:#fff; --border:#d9dde3; --accent:#1f5eff; --accent-fg:#fff; --danger:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --fg:#eceff4; --muted:#9aa4b2; --card:#1b1f27; --border:#2c323d; --accent:#6d97ff; --accent-fg:#0b1020; --danger:#ff7b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:16px; background:var(--bg) url("it-tools-background.webp") center / cover no-repeat fixed; color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:560px; margin:0 auto; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1, h2 { margin:0 0 16px; font-size:1.25rem; }
  .row { padding:12px 0; border-top:1px solid var(--border); }
  .label { font-size:.8rem; color:var(--muted); }
  .value { font:600 1.1rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow-wrap:anywhere; }
  .value.none { font-weight:400; color:var(--muted); font-size:1rem; }
  button, input, select { font:inherit; color:var(--fg); }
  button { padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:transparent; font-size:.85rem; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-size:1rem; padding:8px 16px; }
  button:disabled { opacity:.6; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button[hidden] { display:none; }
  #c4, #c6 { margin-top:6px; }
  form { display:grid; grid-template-columns:1fr auto; gap:8px; }
  form label.field { grid-column:1 / -1; font-size:.8rem; color:var(--muted); margin-bottom:-4px; }
  input[type=text], select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); font-size:1rem; }
  .opts { grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .opts select { width:auto; }
  .error { margin:12px 0 0; color:var(--danger); font-size:.9rem; }
  .hint { margin:12px 0 0; color:var(--muted); font-size:.9rem; }
  table { width:100%; border-collapse:collapse; margin-top:16px; font-size:.9rem; }
  th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--border); vertical-align:top; }
  th { font-size:.8rem; font-weight:400; color:var(--muted); }
  td.data { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow-wrap:anywhere; word-break:break-word; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section aria-labelledby="ip-title">
    <h1 id="ip-title">Deine öffentliche IP-Adresse</h1>
    <div class="row">
      <div class="label">IPv4</div>
      <div class="value" id="v4" aria-live="polite">Wird ermittelt …</div>
      <button type="button" id="c4" hidden>Kopieren</button>
    </div>
    <div class="row">
      <div class="label">IPv6</div>
      <div class="value" id="v6" aria-live="polite">Wird ermittelt …</div>
      <button type="button" id="c6" hidden>Kopieren</button>
    </div>
    <button type="button" id="reload">Neu laden</button>
    <p class="error" id="err" role="alert" hidden></p>
  </section>

  <section aria-labelledby="dns-title">
    <h2 id="dns-title">DNS-Abfrage</h2>
    <form id="dns-form" novalidate>
      <label class="field" for="dns-name">Hostname oder Domain</label>
      <input type="text" id="dns-name" placeholder="example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit" class="primary" id="dns-go">Auflösen</button>
      <div class="opts">
        <label for="dns-type" class="label">Record-Typ</label>
        <select id="dns-type">
          <option value="A">A (IPv4)</option>
          <option value="AAAA">AAAA (IPv6)</option>
          <option value="CNAME">CNAME</option>
          <option value="MX">MX</option>
          <option value="TXT">TXT</option>
          <option value="NS">NS</option>
          <option value="SOA">SOA</option>
          <option value="PTR">PTR (Reverse, IP eingeben)</option>
        </select>
      </div>
    </form>
    <p class="error" id="dns-err" role="alert" hidden></p>
    <p class="hint" id="dns-info" aria-live="polite" hidden></p>
    <table id="dns-table" hidden>
      <thead><tr><th scope="col">Name</th><th scope="col">Typ</th><th scope="col" class="num">TTL</th><th scope="col">Wert</th></tr></thead>
      <tbody id="dns-body"></tbody>
    </table>
    <p class="hint" id="dns-source">Die Abfrage läuft über DNS-over-HTTPS bei Cloudflare (1.1.1.1), bei Bedarf bei Google (8.8.8.8). Dein Browser fragt dort direkt an.</p>
  </section>
</main>
<script>
  const TIMEOUT_MS = 6000;
  async function fetchJson(url, headers) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: "no-store", headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  const getIp = async (url) => (await fetchJson(url)).ip;

  /* ---------- Eigene IP ---------- */
  function show(id, ip) {
    const el = document.getElementById("v" + id);
    const btn = document.getElementById("c" + id);
    if (ip) { el.textContent = ip; el.classList.remove("none"); btn.hidden = false; }
    else { el.textContent = "Nicht verfügbar"; el.classList.add("none"); btn.hidden = true; }
  }
  async function load() {
    const err = document.getElementById("err");
    err.hidden = true;
    for (const id of ["4", "6"]) {
      const el = document.getElementById("v" + id);
      el.textContent = "Wird ermittelt …"; el.classList.add("none");
      document.getElementById("c" + id).hidden = true;
    }
    // api.ipify.org liefert nur IPv4, api6.ipify.org nur IPv6
    const [r4, r6] = await Promise.allSettled([
      getIp("https://api.ipify.org?format=json"),
      getIp("https://api6.ipify.org?format=json")
    ]);
    show("4", r4.status === "fulfilled" ? r4.value : null);
    show("6", r6.status === "fulfilled" ? r6.value : null);
    if (r4.status === "rejected" && r6.status === "rejected") {
      err.textContent = "Die IP-Adresse konnte nicht abgerufen werden. Prüfe deine Verbindung oder Werbeblocker und versuche es erneut.";
      err.hidden = false;
    }
  }
  for (const id of ["4", "6"]) {
    const btn = document.getElementById("c" + id);
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(document.getElementById("v" + id).textContent);
        btn.textContent = "Kopiert"; } catch { btn.textContent = "Fehlgeschlagen"; }
      setTimeout(() => (btn.textContent = "Kopieren"), 1500);
    });
  }
  document.getElementById("reload").addEventListener("click", load);
  load();

  /* ---------- DNS-Abfrage (DNS-over-HTTPS) ---------- */
  const PROVIDERS = [
    { label: "Cloudflare", url: (n, t) => "https://cloudflare-dns.com/dns-query?name=" + encodeURIComponent(n) + "&type=" + encodeURIComponent(t), headers: { accept: "application/dns-json" } },
    { label: "Google", url: (n, t) => "https://dns.google/resolve?name=" + encodeURIComponent(n) + "&type=" + encodeURIComponent(t), headers: undefined }
  ];
  const TYPES = { 1:"A", 2:"NS", 5:"CNAME", 6:"SOA", 12:"PTR", 15:"MX", 16:"TXT", 28:"AAAA", 33:"SRV", 257:"CAA" };
  const STATUS = { 1:"Ungültige Anfrage (FORMERR)", 2:"Serverfehler beim Auflösen (SERVFAIL)", 3:"Der Name existiert nicht (NXDOMAIN)", 5:"Anfrage abgelehnt (REFUSED)" };

  const form = document.getElementById("dns-form");
  const nameInput = document.getElementById("dns-name");
  const typeSelect = document.getElementById("dns-type");
  const goBtn = document.getElementById("dns-go");
  const dnsErr = document.getElementById("dns-err");
  const dnsInfo = document.getElementById("dns-info");
  const dnsTable = document.getElementById("dns-table");
  const dnsBody = document.getElementById("dns-body");
  const dnsSource = document.getElementById("dns-source");
  const DEFAULT_SOURCE = dnsSource.textContent;

  function normalizeName(raw) {
    let s = raw.trim();
    s = s.replace(/^[a-z][a-z0-9+.-]*:\/\//i, "");   // Protokoll entfernen
    s = s.split(/[\/?#]/)[0];                          // Pfad entfernen
    s = s.replace(/^[^@]*@/, "").replace(/:\d+$/, ""); // user@ und Port entfernen
    return s.replace(/\.$/, "");
  }
  function reverseName(ip) {
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return ip.split(".").reverse().join(".") + ".in-addr.arpa";
    if (ip.includes(":")) {
      let [head, tail] = ip.split("::");
      const h = head ? head.split(":") : [];
      const t = tail !== undefined && tail ? tail.split(":") : [];
      const fill = tail === undefined ? [] : Array(Math.max(0, 8 - h.length - t.length)).fill("0");
      const groups = [...h, ...fill, ...t];
      if (groups.length !== 8) return null;
      const hex = groups.map(g => g.padStart(4, "0")).join("");
      if (!/^[0-9a-f]{32}$/i.test(hex)) return null;
      return hex.split("").reverse().join(".") + ".ip6.arpa";
    }
    return null;
  }
  function describeError(err) {
    if (err && err.name === "AbortError") return "Zeitüberschreitung";
    if (err && /^HTTP \d+/.test(err.message)) return err.message;
    return "Verbindung blockiert oder nicht erreichbar";
  }
  function setBusy(busy) { goBtn.disabled = busy; goBtn.textContent = busy ? "Wird abgefragt …" : "Auflösen"; }
  function clearResult() { dnsErr.hidden = true; dnsInfo.hidden = true; dnsTable.hidden = true; dnsBody.textContent = ""; dnsSource.textContent = DEFAULT_SOURCE; }
  function showError(msg) { dnsErr.textContent = msg; dnsErr.hidden = false; }

  async function resolveDns(name, type) {
    const failures = [];
    for (const p of PROVIDERS) {
      try {
        const data = await fetchJson(p.url(name, type), p.headers);
        return { data, provider: p.label };
      } catch (err) {
        failures.push(p.label + ": " + describeError(err));
      }
    }
    const e = new Error(failures.join(" | "));
    e.failures = failures;
    throw e;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearResult();
    let name = normalizeName(nameInput.value);
    const type = typeSelect.value;
    if (!name) { showError("Bitte gib einen Hostnamen oder eine Domain ein."); nameInput.focus(); return; }
    if (type === "PTR") {
      const rev = reverseName(name);
      if (!rev) { showError("Für PTR bitte eine gültige IPv4- oder IPv6-Adresse eingeben."); return; }
      name = rev;
    }
    setBusy(true);
    try {
      const { data, provider } = await resolveDns(name, type);
      dnsSource.textContent = "Antwort von " + provider + " (DNS-over-HTTPS). Dein Browser fragt dort direkt an.";
      if (data.Status !== 0) { showError(STATUS[data.Status] || ("DNS-Fehler (Code " + data.Status + ")")); return; }
      const answers = Array.isArray(data.Answer) ? data.Answer : [];
      if (!answers.length) { dnsInfo.textContent = "Keine " + type + "-Einträge für " + name + " gefunden."; dnsInfo.hidden = false; return; }
      for (const a of answers) {
        const tr = document.createElement("tr");
        const cells = [
          [a.name.replace(/\.$/, ""), "data"],
          [TYPES[a.type] || String(a.type), ""],
          [String(a.TTL), "num"],
          [String(a.data).replace(/^"(.*)"$/s, "$1"), "data"]
        ];
        for (const [text, cls] of cells) {
          const td = document.createElement("td");
          td.textContent = text;
          if (cls) td.className = cls;
          tr.appendChild(td);
        }
        dnsBody.appendChild(tr);
      }
      dnsTable.hidden = false;
    } catch (err) {
      showError("Die DNS-Abfrage ist fehlgeschlagen (" + err.message + "). Vermutlich blockiert dein Netzwerk, Werbeblocker oder Browser DNS-over-HTTPS. Probiere es in einem anderen Netz oder ohne Blocker.");
    } finally {
      setBusy(false);
    }
  });
</script>
</body>
</html>
